[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-spike"
version = "0.1.0"
description = "Poorly-documented API investigation spike: SEC EDGAR + Polygon.io"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",      # FastAPI TestClient
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select  = ["E", "F", "I", "UP"]   # pycodestyle, pyflakes, isort, pyupgrade
ignore  = ["E501"]                 # line length enforced by ruff format, not the linter

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: requires real API keys and a network connection — run with make test-polygon / test-edgar",
]
